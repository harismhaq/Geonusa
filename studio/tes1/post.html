<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><link rel="icon" type="image/png" href="iconatas.png"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postingan Peta — GeoNusa</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#008bb0','primary-dark':'#0b4a75',accent:'#00b0d8'}}}}</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
<header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200">
  <div class="max-w-6xl mx-auto h-14 px-4 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-white border border-slate-200 flex items-center justify-center p-1 overflow-hidden"><img src="logo-sidebar.png" alt="GeoNusa" class="w-full h-full object-contain"></div>
      <span class="text-lg font-extrabold tracking-tight">Geo<span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-cyan-600">Nusa</span></span>
    </a>
    <div id="userPill"></div>
  </div>
</header>
<main class="max-w-6xl mx-auto sm:px-4 sm:py-4">
  <div id="wrap" class="relative bg-white sm:border sm:border-slate-200 sm:rounded-3xl overflow-hidden flex flex-col md:flex-row md:h-[calc(100vh-9rem)]">
    <button onclick="closePage()" title="Tutup (Esc)" class="absolute top-3 right-3 z-[600] w-9 h-9 rounded-full bg-white/95 shadow border border-slate-200 flex items-center justify-center text-slate-600 hover:text-rose-600"><i data-lucide="x" class="w-5 h-5"></i></button>
    <div class="md:flex-1 h-[50vh] md:h-full relative shrink-0"><div id="dMap" class="absolute inset-0"></div></div>
    <div class="md:w-[26rem] flex flex-col min-h-0 border-t md:border-t-0 md:border-l border-slate-200">
      <div class="p-4 border-b border-slate-100 space-y-2 md:max-h-[45%] md:overflow-y-auto">
        <div class="flex items-center gap-3 md:pr-10"><span id="dAv"></span><div class="leading-tight"><a id="dAuthor" class="block text-xs font-extrabold hover:underline"></a><p id="dDate" class="text-[10px] text-slate-500"></p></div></div>
        <h1 id="dTitle" class="font-extrabold text-base">Memuat...</h1><p id="dDesc" class="text-xs text-slate-700 whitespace-pre-line"></p>
        <div id="metaWrap" class="hidden"><button type="button" onclick="$('dMeta').classList.toggle('hidden');$('mChev').classList.toggle('rotate-180')" class="flex items-center gap-1 text-[11px] font-semibold text-slate-500 hover:text-primary"><i data-lucide="info" class="w-3.5 h-3.5"></i>Info peta<span id="mChev" class="transition-transform"><i data-lucide="chevron-down" class="w-3.5 h-3.5"></i></span></button><dl id="dMeta" class="hidden grid grid-cols-2 gap-x-3 gap-y-1.5 text-[11px] mt-2"></dl></div><div id="dTags" class="flex flex-wrap gap-x-2 text-xs"></div>
      </div>
      <div id="dComments" class="flex-1 overflow-y-auto p-4 space-y-3 text-xs max-h-[40vh] md:max-h-none"></div>
      <div class="px-4 py-2 border-t border-slate-100 flex items-center gap-4 text-xs font-semibold text-slate-600">
        <button id="dLike" onclick="toggleLike()" class="flex items-center gap-1.5"></button>
        <button onclick="$('dInput').focus()" class="flex items-center gap-1.5 hover:text-primary"><i data-lucide="message-square" class="w-5 h-5"></i><span id="dCm"></span></button>
        <button id="dSave" onclick="toggleSave()" class="flex items-center gap-1.5"></button>
        <button onclick="sharePost()" class="hover:text-primary" title="Bagikan"><i data-lucide="share-2" class="w-5 h-5"></i></button>
        <button id="dDl" onclick="downloadPost()" class="ml-auto hover:text-emerald-600" title="Unduh Shapefile (ZIP)"><i data-lucide="download" class="w-5 h-5"></i></button>
      </div>
      <form onsubmit="postComment(event)" class="p-3 border-t border-slate-100 flex gap-2"><input id="dInput" maxlength="500" placeholder="Tambahkan komentar..." class="flex-1 px-3 py-2 bg-slate-100 rounded-xl text-xs focus:outline-none"><button class="px-3 text-primary text-xs font-bold">Kirim</button></form>
    </div>
  </div>
</main>
<script src="supabase-config.js"></script>
<script src="common.js"></script>
<script>
const pid0 = new URLSearchParams(location.search).get('id'), META = [['Kategori', 'category'], ['Wilayah', 'region'], ['Tahun data', 'data_year'], ['Sumber', 'source'], ['CRS', 'crs'], ['Format', 'data_format']];
let P = null, liked = false, saved = false, lc = 0, cc = 0, dmap = null;
mountNav('');
const notFound = m => { $('wrap').innerHTML = `<div class="p-10 text-center text-sm text-slate-500 w-full">${esc(m || 'Postingan tidak ditemukan atau bersifat privat.')}<br><a href="index.html" class="text-primary font-bold">← Kembali ke beranda</a></div>`; };

async function load() {
  if (!pid0) return notFound();
  const { data: p, error } = await sb.from('posts').select('*,likes(count),comments(count)').eq('id', pid0).maybeSingle();
  if (error || !p) return notFound(error?.message);
  P = p; lc = p.likes[0]?.count || 0; cc = p.comments[0]?.count || 0;
  const q = t => user ? sb.from(t).select('post_id').eq('post_id', pid0).eq('user_id', user.id).maybeSingle() : { data: null };
  const [{ data: lays }, { data: au }, l, b] = await Promise.all([
    sb.from('spatial_layers').select('name,geojson,color,opacity,stroke_width,style_attr,style_colormap,is_visible').eq('post_id', pid0).order('sort_order').order('created_at'),
    sb.from('public_profiles').select('full_name,avatar_url').eq('id', p.user_id).maybeSingle(), q('likes'), q('bookmarks')]);
  liked = !!l.data; saved = !!b.data;
  const name = au?.full_name || 'Kreator Spasial'; document.title = `${p.title} — GeoNusa`;
  $('dAv').innerHTML = ringAvatar(au?.avatar_url, name); $('dAuthor').textContent = name; $('dAuthor').href = 'profile.html?u=' + p.user_id; $('dDate').textContent = fmtDate(p.created_at);
  $('dTitle').textContent = p.title; $('dDesc').textContent = p.caption || '';
  { const mh = META.filter(([, k]) => p[k]).map(([t, k]) => `<div><dt class="text-slate-400">${t}</dt><dd class="font-semibold text-slate-700">${esc(p[k])}</dd></div>`).join(''); $('dMeta').innerHTML = mh; $('metaWrap').classList.toggle('hidden', !mh); }
  $('dTags').innerHTML = (p.tags || []).map(t => `<a href="index.html?q=${encodeURIComponent(t)}" class="text-primary font-semibold">#${esc(t)}</a>`).join('');
  drawActs(); drawMap(lays || []); loadComments();
}
function drawMap(lays) {
  if (dmap) dmap.remove(); dmap = L.map('dMap').setView([-2.5, 118], 5);
  L.tileLayer(BASES.street[0], { maxZoom: 19, attribution: BASES.street[1] }).addTo(dmap);
  const grp = L.featureGroup(), ops = [];
  lays.filter(l => l.is_visible !== false).forEach((l, k) => {
    const a = l.style_attr, cm = l.style_colormap || {}, st = { op: l.opacity ?? .7 }, nm = l.name || 'Layer ' + (k + 1);
    const colorFor = colorFn(l);
    const lg = L.geoJSON(l.geojson, {
      pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 5 }),
      style: f => lyrStyle(colorFor(f), st.op),
      onEachFeature: (f, ly) => { if (!/Polygon/.test(f.geometry?.type)) ly.bindPopup(() => popupHTML([{ name: nm, props: f.properties, c: colorFor(f) }]), POP); }
    }).addTo(dmap); grp.addLayer(lg);
    ops.push({ lg, st, nm, on: true, src: { name: nm, gj: l.geojson, colorFor }, sw: a ? Object.entries(cm).filter(([x]) => x !== '__else') : [[null, l.color || '#008bb0']] });
  });
  dmap.on('click', e => showFeaturePopup(dmap, e.latlng, ops.filter(o => o.on).map(o => o.src)));   // poligon: semua layer di titik klik
  if (ops.length) layerPanel(dmap, ops);
  setTimeout(() => { dmap.invalidateSize(); const b = grp.getBounds(); if (b.isValid()) dmap.fitBounds(b, { padding: [30, 30] }); }, 100);
}
function drawActs() {
  $('dLike').innerHTML = `<i data-lucide="heart" class="w-5 h-5 ${liked ? 'fill-rose-600 text-rose-600' : ''}"></i><span>${lc}</span>`;
  $('dSave').innerHTML = `<i data-lucide="bookmark" class="w-5 h-5 ${saved ? 'fill-amber-500 text-amber-500' : ''}"></i><span>${saved ? 'Tersimpan' : 'Simpan'}</span>`;
  $('dCm').textContent = cc; $('dDl').classList.toggle('hidden', !P.allow_download); icons();
}
async function toggleLike() {
  if (!user) return openAuth(); const was = liked; liked = !was; lc += was ? -1 : 1; drawActs();
  const { error } = was ? await sb.from('likes').delete().eq('post_id', pid0).eq('user_id', user.id) : await sb.from('likes').insert({ post_id: pid0 });
  if (error) { liked = was; lc += was ? 1 : -1; drawActs(); toast(error.message, 'error'); }
}
async function toggleSave() {
  if (!user) return openAuth(); const was = saved; saved = !was; drawActs();
  const { error } = was ? await sb.from('bookmarks').delete().eq('post_id', pid0).eq('user_id', user.id) : await sb.from('bookmarks').insert({ post_id: pid0 });
  if (error) { saved = was; drawActs(); toast(error.message, 'error'); } else toast(was ? 'Dihapus dari tersimpan' : 'Peta disimpan', 'ok');
}
function sharePost() { const url = new URL('post.html?id=' + pid0, location.href).href; navigator.clipboard.writeText(url).then(() => toast('Tautan disalin', 'ok'), () => prompt('Salin tautan:', url)); }
const downloadPost = () => downloadPostZip(pid0);   // unduh = ZIP Shapefile
async function loadComments() {
  const box = $('dComments'); box.innerHTML = '<p class="text-slate-400">Memuat komentar...</p>';
  const { data, error } = await sb.from('comments').select('id,user_id,body,created_at').eq('post_id', pid0).order('created_at');
  if (error) { box.innerHTML = `<p class="text-rose-500">${esc(error.message)}</p>`; return; }
  if (!data.length) { box.innerHTML = '<p class="text-slate-400">Belum ada komentar.</p>'; return; }
  const { data: au } = await sb.from('public_profiles').select('id,full_name').in('id', [...new Set(data.map(c => c.user_id))]);
  const names = Object.fromEntries((au || []).map(a => [a.id, a.full_name]));
  box.innerHTML = data.map(c => `<div><p class="break-words"><a href="profile.html?u=${c.user_id}" class="font-bold hover:underline">${esc(names[c.user_id] || 'Pengguna')}</a> ${esc(c.body)}</p><p class="text-[10px] text-slate-400">${fmtDate(c.created_at)}${user?.id === c.user_id ? ` · <button onclick="deleteComment('${c.id}')" class="hover:text-rose-600">hapus</button>` : ''}</p></div>`).join('');
  box.scrollTop = box.scrollHeight;
}
async function postComment(e) {
  e.preventDefault(); if (!user) return openAuth(); const body = $('dInput').value.trim(); if (!body) return;
  const { error } = await sb.from('comments').insert({ post_id: pid0, body }); if (error) return toast(error.message, 'error');
  $('dInput').value = ''; cc++; drawActs(); loadComments();
}
async function deleteComment(id) { const { error } = await sb.from('comments').delete().eq('id', id); if (error) return toast(error.message, 'error'); cc--; drawActs(); loadComments(); }
function closePage() {   // kembali ke halaman sebelumnya (posisi scroll feed terjaga); bila dibuka dari tautan langsung → beranda
  let same = false; try { same = document.referrer && new URL(document.referrer).origin === location.origin; } catch {}
  same && history.length > 1 ? history.back() : (location.href = 'index.html');
}
addEventListener('keydown', e => { if (e.key === 'Escape') closePage(); });
onAuth(load);
(async () => { icons(); await bootAuth(); })();
</script>
</body>
</html>
