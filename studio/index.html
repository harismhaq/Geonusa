<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><script>(function(){var p=location.pathname,b=null;if(/\/index$/.test(p))b=p.slice(0,-5);else if(!/\/$|\.[a-z0-9]+$/i.test(p))b=p+"/";if(b)document.write('<base href="'+location.origin+b+'">')})();</script><link rel="icon" type="image/png" href="iconatas.png"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoNusa — Sosmed Peta</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#008bb0','primary-dark':'#0b4a75',accent:'#00b0d8'}}}}</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
<header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200">
  <div class="max-w-xl mx-auto h-14 px-4 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-white border border-slate-200 flex items-center justify-center p-1 shadow-2xs overflow-hidden">
        <img src="logo-sidebar.png" alt="GeoNusa" class="w-full h-full object-contain" />
      </div>
      <span class="text-lg font-extrabold tracking-tight">Geo<span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-cyan-600">Nusa</span></span>
    </a>
    <div id="userPill"></div>
  </div>
</header>

<div class="max-w-xl mx-auto px-3 py-4 space-y-4">
  <input id="q" oninput="filterFeed(this.value)" placeholder="Cari peta, tag, atau kreator..." class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-2xl text-xs focus:outline-none focus:border-primary">
  <div id="chips" class="flex gap-2 overflow-x-auto pb-1"></div>
  <a href="studio.html" class="flex items-center gap-3 bg-white border border-slate-200 rounded-2xl p-3 hover:border-primary">
    <span class="w-9 h-9 rounded-full bg-primary/10 text-primary flex items-center justify-center text-lg font-bold">+</span>
    <span class="text-xs text-slate-500">Bagikan peta Anda ke komunitas</span><span class="ml-auto text-xs font-bold text-primary">Buka Studio →</span>
  </a>
  <a href="panduan.html" class="block text-center text-[11px] font-semibold text-slate-500 hover:text-primary">Baru di GeoNusa? Baca panduan penggunaan →</a>
  <div id="feed" class="space-y-5"><p class="p-8 text-center text-xs text-slate-400">Memuat linimasa...</p></div>
</div>

<script src="supabase-config.js"></script>
<script src="common.js"></script>
<script>
let feedCache = new Map(), likedSet = new Set(), thumbs = [], dmap = null, detailId = null;
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); mini(e.target); } }), { rootMargin: '300px' });

const defaultPalette = ['#008bb0', '#e11d48', '#16a34a', '#d97706', '#9333ea', '#0284c7', '#db2777', '#65a30d'];

// Fungsi render preview dengan mempertimbangkan atribut kustom di kartu feed
async function mini(el) {
  const d = feedCache.get(el.dataset.id); if (!d) return; let pv;
  try { pv = await getPreview(d); } catch (e) { console.error(e); }
  if (!pv) { el.innerHTML = '<p class="h-full flex items-center justify-center text-xs text-slate-400">Ketuk untuk melihat peta</p>'; return; }
  try {
    const m = L.map(el, { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false, boxZoom: false, keyboard: false });
    L.tileLayer(BASES.street[0], { maxZoom: 19 }).addTo(m); L.imageOverlay(pv.img, pv.bounds, { interactive: false }).addTo(m);
    m.fitBounds(pv.bounds, { padding: [24, 24], maxZoom: 16 }); thumbs.push(m);
  } catch (e) { console.error(e); }
}

const card = p => `<article data-q="${esc((p.title + ' ' + (p.caption || '') + ' ' + p.tags.join(' ') + ' ' + p.author).toLowerCase())}" class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-xs">
  <div class="flex items-center gap-3 px-4 py-3">${ringAvatar(p.avatar, p.author)}
    <div class="leading-tight"><a href="profile.html?u=${p.user_id}" class="block text-xs font-extrabold hover:underline">${esc(p.author)}</a><p class="text-[10px] text-slate-500">${fmtDate(p.created_at)}</p></div></div>
  <div id="thumb-${p.id}" data-id="${p.id}" onclick="openPost('${p.id}')" ondblclick="dbl('${p.id}')" class="w-full aspect-[4/3] bg-slate-100 cursor-pointer"></div>
  <div class="px-4 pt-3 flex items-center gap-4 text-slate-700">
    <button id="like-${p.id}" onclick="toggleLike('${p.id}')" class="hover:text-rose-600 transition-colors"></button>
    <button onclick="openPost('${p.id}')" class="hover:text-primary transition-colors" title="Komentar"><i data-lucide="message-square" class="w-5 h-5"></i></button>
    <button onclick="sharePost('${p.id}')" class="hover:text-primary transition-colors" title="Bagikan"><i data-lucide="share-2" class="w-5 h-5"></i></button>
    <button id="bm-${p.id}" onclick="toggleSave('${p.id}')" class="ml-auto hover:text-amber-500 transition-colors" title="Simpan"></button>
    ${p.allow_download ? `<button onclick="downloadPost('${p.id}')" class="hover:text-emerald-600 transition-colors" title="Unduh Shapefile (ZIP)"><i data-lucide="download" class="w-5 h-5"></i></button>` : ''}
  </div>
  <div class="px-4 pb-4 pt-2 space-y-1 text-xs"><p id="lc-${p.id}" class="font-bold"></p><p><b>${esc(p.title)}</b></p>${p.caption ? `<p class="text-slate-600 line-clamp-2 whitespace-pre-line">${esc(p.caption)}</p>` : ''}
    <div class="flex flex-wrap gap-x-2">${p.tags.map(t => `<button data-tag="${esc(t)}" onclick="tagClick(this)" class="text-primary font-semibold">#${esc(t)}</button>`).join('')}</div>
    <button id="cm-${p.id}" onclick="openPost('${p.id}')" class="text-slate-500 hover:text-slate-700"></button></div></article>`;

async function loadFeed() {
  const box = $('feed');
  // Ambil kolom preview_attr dan preview_colormap dari tabel posts
  const { data, error } = await sb.from('posts').select('id,user_id,title,caption,tags,allow_download,preview_img,preview_bounds,created_at,likes(count),comments(count)').eq('published', true).order('created_at', { ascending: false }).limit(30);
  if (error) { box.innerHTML = `<p class="p-8 text-center text-xs text-rose-500">Gagal memuat: ${esc(error.message)}</p>`; return; }
  thumbs.forEach(m => m.remove()); thumbs = [];
  if (!data.length) { box.innerHTML = '<div class="p-8 text-center bg-white border border-slate-200 rounded-2xl text-xs"><p class="font-bold">Belum ada postingan peta</p><p class="text-slate-500 mt-1">Jadilah yang pertama berbagi peta!</p></div>'; return; }
  const ids = data.map(d => d.id), uids = [...new Set(data.map(d => d.user_id))];
  const [{ data: au }, lk] = await Promise.all([sb.from('public_profiles').select('id,full_name,avatar_url').in('id', uids), user ? sb.from('likes').select('post_id').eq('user_id', user.id).in('post_id', ids) : { data: [] }]);
  const names = Object.fromEntries((au || []).map(a => [a.id, a.full_name])), avs = Object.fromEntries((au || []).map(a => [a.id, a.avatar_url]));
  likedSet = new Set((lk.data || []).map(l => l.post_id));
  feedCache = new Map(data.map(d => [d.id, { ...d, tags: d.tags || [], author: names[d.user_id] || 'Kreator Spasial', avatar: avs[d.user_id], likeCount: d.likes[0]?.count || 0, commentCount: d.comments[0]?.count || 0 }]));
  box.innerHTML = [...feedCache.values()].map(card).join('');
  feedCache.forEach((p, id) => { refreshLike(id); refreshCm(id); io.observe($('thumb-' + id)); });
  icons(); 
  loadSaved(ids); const tc = {}; feedCache.forEach(p => p.tags.forEach(t => tc[t] = (tc[t] || 0) + 1));
  $('chips').innerHTML = [['', 'Semua'], ...Object.entries(tc).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([t]) => [t, '#' + t])]
    .map(([t, l]) => `<button data-tag="${esc(t)}" onclick="tagClick(this)" class="shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold bg-white border border-slate-200 hover:border-primary hover:text-primary">${esc(l)}</button>`).join('');
  if ($('q').value) filterFeed($('q').value);
}

function filterFeed(v) { v = v.trim().toLowerCase(); document.querySelectorAll('#feed article').forEach(a => a.classList.toggle('hidden', !!v && !a.dataset.q.includes(v))); }
function tagClick(b) { $('q').value = b.dataset.tag; filterFeed(b.dataset.tag); scrollTo({ top: 0, behavior: 'smooth' }); }

function refreshLike(id) {
  const p = feedCache.get(id); if (!p) return; const l = likedSet.has(id), ic = `<i data-lucide="heart" class="w-5 h-5 ${l ? 'fill-rose-600 text-rose-600' : 'text-slate-700'}"></i>`;
  const b = $('like-' + id); if (b) { b.innerHTML = ic; $('lc-' + id).textContent = `${p.likeCount} suka`; }
  if (detailId === id) $('dLike').innerHTML = ic + `<span>${p.likeCount}</span>`; icons();
}

function refreshCm(id) { const p = feedCache.get(id), b = $('cm-' + id); if (p && b) b.textContent = p.commentCount ? `Lihat semua ${p.commentCount} komentar` : 'Tambahkan komentar'; }

async function toggleLike(id) {
  if (!user) return openAuth();
  const p = feedCache.get(id), l = likedSet.has(id);
  l ? (likedSet.delete(id), p.likeCount--) : (likedSet.add(id), p.likeCount++); refreshLike(id);
  const { error } = l ? await sb.from('likes').delete().eq('post_id', id).eq('user_id', user.id) : await sb.from('likes').insert({ post_id: id });
  if (error) { l ? (likedSet.add(id), p.likeCount++) : (likedSet.delete(id), p.likeCount--); refreshLike(id); toast(error.message, 'error'); }
}

function dbl(id) { if (!user) return openAuth(); if (!likedSet.has(id)) toggleLike(id); }

function sharePost(id) {
  const url = new URL('post.html?id=' + id, location.href).href;
  navigator.clipboard.writeText(url).then(() => toast('Tautan disalin', 'ok'), () => prompt('Salin tautan:', url));
}

const downloadPost = id => downloadPostZip(id);   // unduh = ZIP Shapefile

const openPost = id => { location.href = 'post.html?id=' + id; };   // detail = halaman sendiri (post.html)

/* ---- Simpan / Bookmark ---- */
let savedSet = new Set();
async function loadSaved(ids) {
  savedSet = new Set();
  if (user) { const { data } = await sb.from('bookmarks').select('post_id').eq('user_id', user.id).in('post_id', ids); (data || []).forEach(x => savedSet.add(x.post_id)); }
  ids.forEach(refreshSave);
}
function refreshSave(id) {
  const s = savedSet.has(id), ic = `<i data-lucide="bookmark" class="w-5 h-5 ${s ? 'fill-amber-500 text-amber-500' : 'text-slate-700'}"></i>`;
  const b = $('bm-' + id); if (b) b.innerHTML = ic;
  if (detailId === id) $('dSave').innerHTML = ic + `<span>${s ? 'Tersimpan' : 'Simpan'}</span>`; icons();
}
async function toggleSave(id) {
  if (!user) return openAuth();
  const s = savedSet.has(id); s ? savedSet.delete(id) : savedSet.add(id); refreshSave(id);
  const { error } = s ? await sb.from('bookmarks').delete().eq('post_id', id).eq('user_id', user.id) : await sb.from('bookmarks').insert({ post_id: id });
  if (error) { s ? savedSet.add(id) : savedSet.delete(id); refreshSave(id); toast(error.message, 'error'); } else toast(s ? 'Dihapus dari tersimpan' : 'Peta disimpan', 'ok');
}

onAuth(loadFeed);
(async () => { icons(); const qp = new URLSearchParams(location.search); if (qp.get('q')) $('q').value = qp.get('q'); mountNav('home'); if (qp.get('cari')) $('q').focus(); await bootAuth(); const id = new URLSearchParams(location.search).get('post'); if (id) location.replace('post.html?id=' + id); })();
</script>
</body>
</html>
